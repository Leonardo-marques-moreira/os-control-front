<section class="pagina-interna pagina-tecnicos-lista">
  <main class="conteudo-lista-padrao conteudo-tecnicos-lista">
    <div class="cabecalho-pagina">
      <a class="botao-voltar" routerLink="/home" aria-label="Voltar para Home">
        <img class="icone-voltar" src="assets/icone-voltar.png" alt="" />
      </a>

      <h1 class="titulo-pagina">Técnicos</h1>
    </div>

    <section class="barra-filtros">
      <div class="bloco-filtro bloco-filtro-nome">
        <label class="rotulo-campo" for="filtro-nome-tecnico">Nome do técnico</label>
        <div class="controle-pesquisa">
          <input
            class="entrada-campo entrada-nome"
            id="filtro-nome-tecnico"
            type="text"
            [(ngModel)]="filtroNome"
            [ngModelOptions]="{ standalone: true }"
            (keyup.enter)="aplicarFiltros()"
          />
          <button
            class="botao-pesquisa"
            type="button"
            aria-label="Pesquisar tecnicos"
            (click)="aplicarFiltros()"
          >
            <img class="icone-pesquisa" src="assets/icone-lupa.png" alt="" />
          </button>
        </div>
      </div>

      <div class="bloco-filtro bloco-filtro-id">
        <label class="rotulo-campo" for="filtro-id-tecnico">Id</label>
        <input
          class="entrada-campo entrada-id"
          id="filtro-id-tecnico"
          type="text"
          [(ngModel)]="filtroId"
          [ngModelOptions]="{ standalone: true }"
          (keyup.enter)="aplicarFiltros()"
        />
      </div>

      <button
        class="botao-filtro"
        type="button"
        aria-label="Filtrar tecnicos"
        (click)="aplicarFiltros()"
      >
        <img class="icone-filtro" src="assets/icone-filtro.png" alt="" />
      </button>

      <a class="botao-novo-item" routerLink="/tecnicos/novo">
        <span>Novo t&eacute;cnico</span>
        <img class="icone-adicionar" src="assets/icone-adicionar.png" alt="" />
      </a>
    </section>

    <section class="tabela-lista">
      <div class="cabecalho-tabela">
        <span>Id</span>
        <span>Nome</span>
        <span>Telefone</span>
        <span class="coluna-acoes" aria-hidden="true"></span>
      </div>

      <div class="corpo-tabela">
        <div class="linha-tabela" *ngFor="let tecnico of tecnicosFiltrados">
          <span>{{ tecnico.id }}</span>
          <span>{{ tecnico.nome }}</span>
          <span>{{ tecnico.telefone }}</span>

          <div class="acoes-tecnico">
            <a
              class="botao-acao botao-editar"
              [routerLink]="['/tecnicos/editar', tecnico.id]"
              aria-label="Editar tecnico"
            >
              <img class="icone-acao" src="assets/icone-editar-lapis.png" alt="" />
            </a>

            <button
              class="botao-acao botao-excluir"
              type="button"
              (click)="excluirTecnico(tecnico.id)"
              aria-label="Excluir tecnico"
            >
              <img class="icone-acao" src="assets/icone-lixeira-deletar.png" alt="" />
            </button>
          </div>
        </div>

        <div class="linha-tabela linha-vazia" *ngFor="let _ of linhasVazias"></div>
      </div>
    </section>
  </main>
</section>
