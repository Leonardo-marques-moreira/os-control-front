<section class="pagina-interna pagina-ordens-visualizar">
  <main class="conteudo-lista-padrao conteudo-ordens-visualizar">
    <div class="cabecalho-pagina">
      <a class="botao-voltar" routerLink="/ordens-servico" aria-label="Voltar para menu de OS">
        <img class="icone-voltar" src="assets/icone-voltar.png" alt="" />
      </a>

      <h1 class="titulo-pagina">Visualizar ordens de servi&ccedil;o</h1>
    </div>

    <section class="barra-filtros">
      <div class="bloco-filtro bloco-filtro-cliente">
        <label class="rotulo-campo" for="filtro-cliente-os">Pesquisar por cliente</label>
        <div class="controle-pesquisa">
          <input
            class="entrada-campo entrada-cliente"
            id="filtro-cliente-os"
            type="text"
            [(ngModel)]="filtroCliente"
            [ngModelOptions]="{ standalone: true }"
            (keyup.enter)="aplicarFiltros()"
          />
          <button
            class="botao-pesquisa"
            type="button"
            aria-label="Pesquisar por cliente"
            (click)="aplicarFiltros()"
          >
            <img class="icone-pesquisa" src="assets/icone-lupa.png" alt="" />
          </button>
        </div>
      </div>

      <div class="bloco-filtro">
        <label class="rotulo-campo" for="filtro-tecnico-os">T&eacute;cnico</label>
        <span class="controle-select">
          <select
            class="entrada-campo entrada-select"
            id="filtro-tecnico-os"
            [(ngModel)]="filtroTecnico"
            [ngModelOptions]="{ standalone: true }"
            (change)="aplicarFiltros()"
          >
            <option value="">Todos</option>
            <option *ngFor="let tecnico of tecnicosDisponiveis" [value]="tecnico">
              {{ tecnico }}
            </option>
          </select>
          <img class="icone-dropdown-campo" src="assets/icone-dropdown.png" alt="" />
        </span>
      </div>

      <div class="bloco-filtro bloco-filtro-status">
        <label class="rotulo-campo" for="filtro-status-os">Status</label>
        <span class="controle-select">
          <select
            class="entrada-campo entrada-select"
            id="filtro-status-os"
            [(ngModel)]="filtroStatus"
            [ngModelOptions]="{ standalone: true }"
            (change)="aplicarFiltros()"
          >
            <option value="">Todos</option>
            <option *ngFor="let status of statusDisponiveis" [value]="status">{{ status }}</option>
          </select>
          <img class="icone-dropdown-campo" src="assets/icone-dropdown.png" alt="" />
        </span>
      </div>

      <button
        class="botao-filtro"
        type="button"
        aria-label="Filtrar ordens de servico"
        (click)="aplicarFiltros()"
      >
        <img class="icone-filtro" src="assets/icone-filtro.png" alt="" />
      </button>
    </section>

    <section class="tabela-lista">
      <div class="cabecalho-tabela">
        <span>Id</span>
        <span>Data de abertura</span>
        <span>Cliente</span>
        <span>Ve&iacute;culo</span>
        <span>Status</span>
        <span>T&eacute;cnico</span>
        <span class="coluna-acoes" aria-hidden="true"></span>
      </div>

      <div class="corpo-tabela">
        <div class="linha-tabela" *ngFor="let ordem of ordensFiltradas">
          <span>{{ ordem.id }}</span>
          <span>{{ ordem.dataAbertura }}</span>
          <span>{{ ordem.cliente }}</span>
          <span>{{ ordem.veiculo }}</span>
          <span>{{ ordem.status }}</span>
          <span>{{ ordem.tecnico }}</span>

          <a
            class="botao-editar-ordem"
            [routerLink]="['/ordens-servico/editar', ordem.id]"
            aria-label="Editar ordem de servico"
          >
            <img class="icone-acao" src="assets/icone-editar-lapis.png" alt="" />
          </a>
        </div>

        <div class="linha-tabela linha-vazia" *ngFor="let _ of linhasVazias"></div>
      </div>
    </section>
  </main>
</section>
