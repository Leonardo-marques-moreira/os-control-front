<section class="pagina-interna pagina-clientes-lista">
  <main class="conteudo-lista-padrao conteudo-clientes-lista">
    <div class="cabecalho-pagina">
      <a class="botao-voltar" routerLink="/home" aria-label="Voltar para Home">
        <img class="icone-voltar" src="assets/icone-voltar.png" alt="" />
      </a>

      <h1 class="titulo-pagina">Clientes</h1>
    </div>

    <section class="barra-filtros">
      <div class="bloco-filtro bloco-filtro-nome">
        <label class="rotulo-campo" for="filtro-nome-cliente">Nome do cliente</label>
        <div class="controle-pesquisa">
          <input
            class="entrada-campo entrada-nome"
            id="filtro-nome-cliente"
            type="text"
            [(ngModel)]="filtroNome"
            [ngModelOptions]="{ standalone: true }"
            (keyup.enter)="aplicarFiltros()"
          />
          <button
            class="botao-pesquisa"
            type="button"
            aria-label="Pesquisar clientes"
            (click)="aplicarFiltros()"
          >
            <img class="icone-pesquisa" src="assets/icone-lupa.png" alt="" />
          </button>
        </div>
      </div>

      <div class="bloco-filtro bloco-filtro-id">
        <label class="rotulo-campo" for="filtro-id-cliente">Id</label>
        <input
          class="entrada-campo entrada-id"
          id="filtro-id-cliente"
          type="text"
          [(ngModel)]="filtroId"
          [ngModelOptions]="{ standalone: true }"
          (keyup.enter)="aplicarFiltros()"
        />
      </div>

      <button
        class="botao-filtro"
        type="button"
        aria-label="Filtrar clientes"
        (click)="aplicarFiltros()"
      >
        <img class="icone-filtro" src="assets/icone-filtro.png" alt="" />
      </button>

      <a class="botao-novo-cliente" routerLink="/clientes/novo">
        <span>Novo cliente</span>
        <img class="icone-adicionar" src="assets/icone-adicionar.png" alt="" />
      </a>
    </section>

    <section class="tabela-clientes">
      <div class="cabecalho-tabela">
        <span>Id</span>
        <span>Cliente</span>
        <span>Telefone</span>
        <span>Cidade</span>
        <span>Ve&iacute;culo</span>
        <span class="coluna-acoes" aria-hidden="true"></span>
      </div>

      <div class="corpo-tabela">
        <div class="linha-tabela" *ngFor="let cliente of clientesFiltrados">
          <span>{{ cliente.id }}</span>
          <span>{{ cliente.nome }}</span>
          <span>{{ cliente.telefone }}</span>
          <span>{{ cliente.cidade }}</span>
          <span>{{ cliente.veiculo }}</span>

          <div class="acoes-cliente">
            <a
              class="botao-acao botao-editar-cliente"
              [routerLink]="['/clientes/editar', cliente.id]"
              aria-label="Editar cliente"
            >
              <img class="icone-acao" src="assets/icone-editar-lapis.png" alt="" />
            </a>

            <button
              class="botao-acao botao-excluir-cliente"
              type="button"
              (click)="excluirCliente(cliente.id)"
              aria-label="Excluir cliente"
            >
              <img class="icone-acao" src="assets/icone-lixeira-deletar.png" alt="" />
            </button>
          </div>
        </div>

        <div class="linha-tabela linha-vazia" *ngFor="let _ of linhasVazias"></div>
      </div>
    </section>
  </main>
</section>
