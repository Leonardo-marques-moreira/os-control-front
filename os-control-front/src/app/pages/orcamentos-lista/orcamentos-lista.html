<section class="pagina-interna pagina-orcamentos-lista">
  <main class="conteudo-lista-padrao conteudo-orcamentos-lista">
    <div class="cabecalho-pagina">
      <a class="botao-voltar" routerLink="/home" aria-label="Voltar para Home">
        <img class="icone-voltar" src="assets/icone-voltar.png" alt="" />
      </a>

      <h1 class="titulo-pagina">Or&ccedil;amentos</h1>
    </div>

    <section class="barra-filtros">
      <div class="bloco-filtro bloco-filtro-nome">
        <label class="rotulo-campo" for="filtro-nome-orcamento">Nome do or&ccedil;amento</label>
        <div class="controle-pesquisa">
          <input
            class="entrada-campo entrada-nome"
            id="filtro-nome-orcamento"
            type="text"
            [(ngModel)]="filtroNome"
            [ngModelOptions]="{ standalone: true }"
            (keyup.enter)="aplicarFiltros()"
          />
          <button
            class="botao-pesquisa"
            type="button"
            aria-label="Pesquisar orcamentos"
            (click)="aplicarFiltros()"
          >
            <img class="icone-pesquisa" src="assets/icone-lupa.png" alt="" />
          </button>
        </div>
      </div>

      <div class="bloco-filtro bloco-filtro-id">
        <label class="rotulo-campo" for="filtro-id-orcamento">Id</label>
        <input
          class="entrada-campo entrada-id"
          id="filtro-id-orcamento"
          type="text"
          [(ngModel)]="filtroId"
          [ngModelOptions]="{ standalone: true }"
          (keyup.enter)="aplicarFiltros()"
        />
      </div>

      <button
        class="botao-filtro"
        type="button"
        aria-label="Filtrar orcamentos"
        (click)="aplicarFiltros()"
      >
        <img class="icone-filtro" src="assets/icone-filtro.png" alt="" />
      </button>

      <a class="botao-novo-item" routerLink="/orcamentos/novo">
        <span>Novo or&ccedil;amento</span>
        <img class="icone-adicionar" src="assets/icone-adicionar.png" alt="" />
      </a>
    </section>

    <section class="tabela-lista">
      <div class="cabecalho-tabela">
        <span>Id</span>
        <span>Nome do or&ccedil;amento</span>
        <span>Valor total</span>
        <span class="coluna-acoes" aria-hidden="true"></span>
      </div>

      <div class="corpo-tabela">
        <div class="linha-tabela" *ngFor="let orcamento of orcamentosFiltrados">
          <span>{{ orcamento.id }}</span>
          <span>{{ orcamento.nome }}</span>
          <span>{{ orcamento.valorTotal }}</span>

          <div class="acoes-item">
            <a
              class="botao-acao botao-editar"
              [routerLink]="['/orcamentos/editar', orcamento.id]"
              aria-label="Editar orcamento"
            >
              <img class="icone-acao" src="assets/icone-editar-lapis.png" alt="" />
            </a>

            <button
              class="botao-acao botao-excluir"
              type="button"
              (click)="excluirOrcamento(orcamento.id)"
              aria-label="Excluir orcamento"
            >
              <img class="icone-acao" src="assets/icone-lixeira-deletar.png" alt="" />
            </button>
          </div>
        </div>

        <div class="linha-tabela linha-vazia" *ngFor="let _ of linhasVazias"></div>
      </div>
    </section>
  </main>
</section>
