<section class="pagina-interna pagina-ordens-importar">
  <main class="conteudo-lista-padrao conteudo-ordens-importar">
    <div class="cabecalho-pagina">
      <a class="botao-voltar" routerLink="/ordens-servico" aria-label="Voltar para menu de OS">
        <img class="icone-voltar" src="assets/icone-voltar.png" alt="" />
      </a>

      <h1 class="titulo-pagina">Importar or&ccedil;amento</h1>
    </div>

    <section class="barra-filtros">
      <div class="bloco-filtro bloco-filtro-nome">
        <label class="rotulo-campo" for="filtro-nome-orcamento-importar">Nome do orcamento</label>
        <div class="controle-pesquisa">
          <input
            class="entrada-campo entrada-nome"
            id="filtro-nome-orcamento-importar"
            type="text"
            [(ngModel)]="filtroNome"
            [ngModelOptions]="{ standalone: true }"
            (keyup.enter)="aplicarFiltros()"
          />
          <button
            class="botao-pesquisa"
            type="button"
            aria-label="Pesquisar orcamentos"
            (click)="aplicarFiltros()"
          >
            <img class="icone-pesquisa" src="assets/icone-lupa.png" alt="" />
          </button>
        </div>
      </div>

      <div class="bloco-filtro bloco-filtro-id">
        <label class="rotulo-campo" for="filtro-id-orcamento-importar">Id</label>
        <input
          class="entrada-campo entrada-id"
          id="filtro-id-orcamento-importar"
          type="text"
          [(ngModel)]="filtroId"
          [ngModelOptions]="{ standalone: true }"
          (keyup.enter)="aplicarFiltros()"
        />
      </div>

      <button
        class="botao-filtro"
        type="button"
        aria-label="Filtrar orcamentos"
        (click)="aplicarFiltros()"
      >
        <img class="icone-filtro" src="assets/icone-filtro.png" alt="" />
      </button>
    </section>

    <section class="tabela-lista">
      <div class="cabecalho-tabela">
        <span>Id</span>
        <span>Nome do or&ccedil;amento</span>
        <span class="coluna-acao-confirmar" aria-hidden="true"></span>
      </div>

      <div class="corpo-tabela">
        <a
          class="linha-tabela linha-link"
          *ngFor="let orcamento of orcamentosFiltrados"
          [routerLink]="['/ordens-servico/importar', orcamento.id]"
        >
          <span>{{ orcamento.id }}</span>
          <span>{{ orcamento.nome }}</span>
          <span class="acao-confirmar" aria-hidden="true">
            <img class="icone-confirmar" src="assets/icone-selecionar-ok.png" alt="" />
          </span>
        </a>

        <div class="linha-tabela linha-vazia" *ngFor="let _ of linhasVazias"></div>
      </div>
    </section>
  </main>
</section>
