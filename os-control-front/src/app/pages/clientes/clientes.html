<section class="pagina-interna pagina-clientes">
  <main class="conteudo-pagina-padrao conteudo-clientes">
    <div class="cabecalho-pagina">
      <a class="botao-voltar" routerLink="/clientes" aria-label="Voltar para clientes">
        <img class="icone-voltar" src="assets/icone-voltar.png" alt="" />
      </a>

      <h1 class="titulo-pagina">{{ titulo }}</h1>
    </div>

    <form class="formulario-cliente" (ngSubmit)="salvarCliente()">
      <section class="secao-formulario">
        <h2 class="titulo-secao">Dados do Cliente</h2>

        <div class="grade-dados-cliente">
          <div class="campo-formulario campo-nome">
            <label class="rotulo-campo" for="nome-cliente">Nome</label>
            <input
              class="entrada-campo"
              id="nome-cliente"
              type="text"
              [(ngModel)]="cliente.nome"
              name="nomeCliente"
            />
          </div>

          <div class="campo-formulario campo-cpf">
            <label class="rotulo-campo" for="cpf-cliente">CPF</label>
            <input
              class="entrada-campo"
              id="cpf-cliente"
              type="text"
              maxlength="14"
              inputmode="numeric"
              [ngModel]="cliente.cpf"
              (ngModelChange)="atualizarCpf($event)"
              name="cpfCliente"
            />
          </div>

          <div class="campo-formulario campo-telefone">
            <label class="rotulo-campo" for="telefone-cliente">Telefone</label>
            <input
              class="entrada-campo entrada-campo-menor"
              id="telefone-cliente"
              type="text"
              maxlength="15"
              inputmode="numeric"
              [ngModel]="cliente.telefone"
              (ngModelChange)="atualizarTelefone($event)"
              name="telefoneCliente"
            />
          </div>
        </div>
      </section>

      <section class="secao-formulario secao-endereco">
        <h2 class="titulo-secao">Endere&ccedil;o</h2>

        <div class="grade-endereco">
          <div class="campo-formulario area-cep">
            <label class="rotulo-campo" for="cep-cliente">CEP</label>
            <input
              class="entrada-campo"
              id="cep-cliente"
              maxlength="8"
              type="text"
              inputmode="numeric"
              [ngModel]="cliente.cep"
              (ngModelChange)="atualizarCep($event)"
              name="cepCliente"
            />
          </div>

          <div class="campo-formulario area-rua">
            <label class="rotulo-campo" for="rua-cliente">Rua</label>
            <input
              class="entrada-campo"
              id="rua-cliente"
              type="text"
              [(ngModel)]="cliente.rua"
              name="ruaCliente"
            />
          </div>

          <div class="campo-formulario area-bairro">
            <label class="rotulo-campo" for="bairro-cliente">Bairro</label>
            <input
              class="entrada-campo"
              id="bairro-cliente"
              type="text"
              [(ngModel)]="cliente.bairro"
              name="bairroCliente"
            />
          </div>

          <div class="campo-formulario area-cidade">
            <label class="rotulo-campo" for="cidade-cliente">Cidade</label>
            <input
              class="entrada-campo"
              id="cidade-cliente"
              type="text"
              [(ngModel)]="cliente.cidade"
              name="cidadeCliente"
            />
          </div>

          <div class="campo-formulario area-estado">
            <label class="rotulo-campo" for="estado-cliente">Estado</label>
            <input
              class="entrada-campo"
              id="estado-cliente"
              type="text"
              [(ngModel)]="cliente.estado"
              name="estadoCliente"
            />
          </div>

          <div class="campo-formulario area-complemento">
            <label class="rotulo-campo" for="complemento-cliente">Complemento</label>
            <input
              class="entrada-campo"
              id="complemento-cliente"
              type="text"
              [(ngModel)]="cliente.complemento"
              name="complementoCliente"
            />
          </div>

          <div class="area-acao-veiculo">
            <button class="botao-veiculo" type="button" (click)="abrirCadastroVeiculo()">
              Cadastrar Ve&iacute;culo
            </button>
          </div>
        </div>
      </section>

      <section class="secao-formulario secao-veiculos">
        <div class="cabecalho-veiculos">
          <h2 class="titulo-secao">Ve&iacute;culos cadastrados</h2>
          <span class="texto-veiculo-apoio" *ngIf="!veiculos.length"
            >Nenhum ve&iacute;culo cadastrado.</span
          >
        </div>

        <div class="lista-veiculos" *ngIf="veiculos.length">
          <article class="cartao-veiculo" *ngFor="let veiculo of veiculos">
            <div class="dados-veiculo">
              <strong>{{ veiculo.modelo || 'Veiculo' }}</strong>
              <span>Marca: {{ veiculo.marca || '--' }}</span>
              <span>Placa: {{ veiculo.placa || '--' }}</span>
              <span>Ano: {{ veiculo.ano || '--' }}</span>
            </div>

            <button
              class="botao-excluir-veiculo"
              type="button"
              (click)="excluirVeiculo(veiculo.id)"
            >
              Excluir ve&iacute;culo
            </button>
          </article>
        </div>
      </section>

      <div class="rodape-formulario">
        <button class="botao-cliente" type="submit">{{ textoBotao }}</button>
      </div>
    </form>
  </main>

  <div class="sobreposicao-modal" *ngIf="cadastroVeiculoAberto" (click)="fecharCadastroVeiculo()">
    <div class="modal-veiculo" (click)="$event.stopPropagation()">
      <button
        class="botao-fechar-modal"
        type="button"
        (click)="fecharCadastroVeiculo()"
        aria-label="Fechar cadastro de veiculo"
      >
        <img class="icone-fechar-modal" src="assets/icone-fechar.png" alt="" />
      </button>

      <form class="formulario-modal" (ngSubmit)="adicionarVeiculo()">
        <h2 class="titulo-modal">Cadastro de Veículo</h2>

        <div class="grade-veiculo">
          <input
            class="entrada-modal"
            type="text"
            placeholder="Marca"
            [ngModel]="novoVeiculo.marca"
            (ngModelChange)="atualizarVeiculo('marca', $event)"
            name="veiculoMarca"
          />
          <input
            class="entrada-modal"
            type="text"
            placeholder="Placa"
            [ngModel]="novoVeiculo.placa"
            (ngModelChange)="atualizarVeiculo('placa', $event)"
            name="veiculoPlaca"
          />
          <input
            class="entrada-modal"
            type="text"
            placeholder="Modelo"
            [ngModel]="novoVeiculo.modelo"
            (ngModelChange)="atualizarVeiculo('modelo', $event)"
            name="veiculoModelo"
          />
          <input
            class="entrada-modal"
            type="text"
            placeholder="Ano"
            [ngModel]="novoVeiculo.ano"
            (ngModelChange)="atualizarVeiculo('ano', $event)"
            name="veiculoAno"
          />
        </div>

        <button class="botao-modal" type="submit">Cadastrar</button>
      </form>
    </div>
  </div>
</section>
